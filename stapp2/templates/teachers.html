<!DOCTYPE html>
<html lang="th">
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คณาจารย์ - วิทยาลัยคอมพิวเตอร์</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --light-color: #ecf0f1;
            --dark-color: #34495e;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f8f9fa;
        }

        .navbar {
            background-color: var(--primary-color) !important;
        }

        .navbar-brand, .nav-link {
            color: white !important;
        }

        .nav-link:hover {
            color: var(--secondary-color) !important;
        }

        .hero-section {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 80px 0;
            text-align: center;
        }

        .hero-section h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .hero-section p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .teacher-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            height: 100%;
            background: white;
            margin-bottom: 30px;
        }

        .teacher-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .teacher-card-img-top {
            height: 280px;
            object-fit: cover;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            background-color: var(--light-color);
            background-image: url('https://via.placeholder.com/300x280?text=Teacher+Photo');
            background-size: cover;
            background-position: center;
        }

        .teacher-card-body {
            padding: 25px;
        }

        .teacher-card-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .teacher-card-text {
            color: #666;
            margin-bottom: 20px;
            min-height: 80px;
        }

        .teacher-meta {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #666;
        }

        .teacher-meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .teacher-meta-item i {
            color: var(--secondary-color);
        }

        .btn-outline-primary {
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .btn-outline-primary:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: var(--secondary-color);
            border-radius: 2px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
        }

        .filter-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .filter-section h4 {
            margin-top: 0;
            color: var(--primary-color);
        }

        .form-control, .form-select {
            border-radius: 10px;
            border: 2px solid #eee;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 0.25rem rgba(52, 152, 219, 0.25);
        }

        .btn-filter {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 500;
        }

        .btn-filter:hover {
            background-color: #2980b9;
        }

        .teacher-stats {
            display: flex;
            justify-content: space-around;
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .stat-item {
            flex: 1;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
            display: block;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 1rem;
            color: #666;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .hero-section h1 {
                font-size: 2.2rem;
            }

            .hero-section p {
                font-size: 1rem;
            }

            .teacher-stats {
                flex-wrap: wrap;
            }

            .stat-item {
                margin-bottom: 15px;
                flex: 0 0 50%;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'app1:home' %}">
                <i class="fas fa-laptop-code"></i> วิทยาลัยคอมพิวเตอร์
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'app1:home' %}">หน้าแรก</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'app1:about' %}">เกี่ยวกับเรา</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'app1:courses' %}">หลักสูตร</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'app1:study_plans' %}">แผนการเรียน</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'app1:teachers' %}">คณาจารย์</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'app1:contact' %}">ติดต่อเรา</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="container">
            <h1>คณาจารย์วิทยาลัยคอมพิวเตอร์</h1>
            <p>ทีมคณาจารย์ผู้เชี่ยวชาญในด้านวิทยาการคอมพิวเตอร์และเทคโนโลยีสารสนเทศ</p>
        </div>
    </section>

    <!-- Teacher Stats -->
    <section>
        <div class="container">
            <div class="teacher-stats">
                <div class="stat-item">
                    <span class="stat-number">{{ teachers|length }}</span>
                    <span class="stat-label">คณาจารย์</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number">10+</span>
                    <span class="stat-label">หลักสูตร</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number">1000+</span>
                    <span class="stat-label">ศิษย์เก่า</span>
                </div>
            </div>
        </div>
    </section>

    <!-- Filter Section -->
    <section>
        <div class="container">
            <div class="filter-section">
                <h4>กรองคณาจารย์</h4>
                <div class="row">
                    <div class="col-md-3">
                        <select class="form-select">
                            <option selected>ทั้งหมด</option>
                            <option>ศาสตราจารย์</option>
                            <option>รองศาสตราจารย์</option>
                            <option>ผู้ช่วยศาสตราจารย์</option>
                            <option>อาจารย์</option
                        </select>
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" placeholder="ค้นหาชื่อ...">
                    </div>
                    <div class="col-md-3">
                        <select class="form-select">
                            <option selected>เรียงตาม</option>
                            <option>ชื่อ A-Z</option>
                            <option>ชื่อ Z-A</option
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-filter w-100">กรอง</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Teachers Section -->
    <section class="py-5">
        <div class="container">
            <h2 class="section-title">รายชื่อคณาจารย์</h2>
            <div class="row">
                {% for teacher in teachers %}
                <div class="col-md-4">
                    <div class="teacher-card h-100">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">{{ teacher.prefix }} {{ teacher.first_name }} {{ teacher.last_name }}</h5>
                            <p class="card-text">{{ teacher.bio|truncatewords:15 }}</p>
                            <div class="teacher-meta mt-3">
                                <div class="teacher-meta-item">
                                    <i class="fas fa-envelope"></i>
                                    <span>{{ teacher.email }}</span>
                                </div>
                                <div class="teacher-meta-item">
                                    <i class="fas fa-phone"></i>
                                    <span>{{ teacher.phone|default:"-" }}</span>
                                </div>
                            </div>
                            <a href="#" class="btn btn-outline-primary mt-auto">ดูรายละเอียด</a>
                        </div>
                    </div>
                {% empty %}
                <p>ยังไม่มีข้อมูลคณาจารย์ในระบบ</p>
                {% endfor %}
            </div>
        </div>
    </section>

    <!-- Call to Action -->
    <section class="bg-light py-5">
        <div class="container text-center">
            <h3>สนใจร่วมงานกับเรา?</h3>
            <p class="lead">วิทยาลัยคอมพิวเตอร์กำลังมองหาคณาจารย์ผู้มีความสามารถร่วมทีม</p>
            <a href="{% url 'app1:contact' %}" class="btn btn-primary btn-lg mt-4">ติดต่อเรา</a>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <h5>เกี่ยวกับเรา</h5>
                    <p>วิทยาลัยคอมพิวเตอร์มุ่งมั่นในการผลิตบัณฑิตที่มีความรู้ความสามารถในด้านวิทยาการคอมพิวเตอร์และเทคโนโลยีสารสนเทศ เพื่อตอบสนองความต้องการของตลาดงานและสังคม</p>
                </div>
                <div class="col-md-4">
                    <h5>ลิงก์เร็ว</h5>
                    <ul class="list-unstyled">
                        <li><a href="{% url 'app1:home' %}" class="text-white text-decoration-none">หน้าแรก</a></li>
                        <li><a href="{% url 'app1:about' %}" class="text-white text-decoration-none">เกี่ยวกับเรา</a></li>
                        <li><a href="{% url 'app1:courses' %}" class="text-white text-decoration-none">หลักสูตร</a></li>
                        <li><a href="{% url 'app1:study_plans' %}" class="text-white text-decoration-none">แผนการเรียน</a></li>
                        <li><a href="{% url 'app1:teachers' %}" class="text-white text-decoration-none">คณาจารย์</a></li>
                        <li><a href="{% url 'app1:contact' %}" class="text-white text-decoration-none">ติดต่อเรา</a></li>
                    </ul>
                </div>
                <div class="col-md-4">
                    <h5>ติดตามเรา</h5>
                    <div class="social-links">
                        <a href="#"><i class="fab fa-facebook-f"></i></a>
                        <a href="#"><i class="fab fa-twitter"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
                        <a href="#"><i class="fab fa-linkedin-in"></i></a>
                    </div
                </div>
            </div>
            <div class="text-center mt-4">
                <p>&copy; {% now "Y" %} วิทยาลัยคอมพิวเตอร์. สงวนลิขสิทธิ์ทุกประการ.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
